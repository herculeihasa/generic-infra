# Organisation policy: Kubernetes service accounts managed by Terraform do not
# automount API tokens; workloads that need the API opt in explicitly (and
# then require an accepted exception).
metadata:
  id: "CKV2_AZINFRA_4"
  name: "Kubernetes service accounts must not automount API tokens"
  category: "KUBERNETES"
definition:
  cond_type: "attribute"
  resource_types:
    - "kubernetes_service_account_v1"
    - "kubernetes_default_service_account_v1"
  attribute: "automount_service_account_token"
  operator: "equals"
  value: false
