# Organisation policy: every AKS cluster uses Kubernetes RBAC, no static
# local accounts, and exposes an OIDC issuer (Workload Identity).
metadata:
  id: "CKV2_AZINFRA_2"
  name: "AKS clusters must enable RBAC and the OIDC issuer and disable local accounts"
  category: "IAM"
definition:
  and:
    - cond_type: "attribute"
      resource_types:
        - "azurerm_kubernetes_cluster"
      attribute: "role_based_access_control_enabled"
      operator: "equals"
      value: true
    - cond_type: "attribute"
      resource_types:
        - "azurerm_kubernetes_cluster"
      attribute: "local_account_disabled"
      operator: "equals"
      value: true
    - cond_type: "attribute"
      resource_types:
        - "azurerm_kubernetes_cluster"
      attribute: "oidc_issuer_enabled"
      operator: "equals"
      value: true
