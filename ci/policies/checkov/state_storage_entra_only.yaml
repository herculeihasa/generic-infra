# Organisation policy: storage accounts (Terraform state and any future data
# store) accept Microsoft Entra ID only, TLS 1.2+, with double encryption.
metadata:
  id: "CKV2_AZINFRA_1"
  name: "Storage accounts must disable Shared Key, require TLS 1.2 and enable infrastructure encryption"
  category: "ENCRYPTION"
definition:
  and:
    - cond_type: "attribute"
      resource_types:
        - "azurerm_storage_account"
      attribute: "shared_access_key_enabled"
      operator: "equals"
      value: false
    - cond_type: "attribute"
      resource_types:
        - "azurerm_storage_account"
      attribute: "min_tls_version"
      operator: "equals"
      value: "TLS1_2"
    - cond_type: "attribute"
      resource_types:
        - "azurerm_storage_account"
      attribute: "infrastructure_encryption_enabled"
      operator: "equals"
      value: true
