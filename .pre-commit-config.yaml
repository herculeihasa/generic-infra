# =============================================================================
# pre-commit framework for generic-infra (az-infra-generic + tp-local)
#
#   pre-commit install                      # once per clone (commit + push hooks)
#   pre-commit run --all-files              # commit-stage hooks on every file
#   pre-commit run --hook-stage manual --all-files   # push + manual (heavy) hooks
#
# Stages (see docs/pre-commit.md):
#   pre-commit  fast, offline after the first install, run on staged files
#   pre-push    Terraform validation and lint on the pushed changes
#   manual      tests and security scans (also run by CI)
#
# Every remote hook repository is pinned to a release tag; the tool versions
# shared with CI (gitleaks, actionlint) must match ci/tool-versions.env
# (checked by ci/tests/test_precommit.py).
# =============================================================================

minimum_pre_commit_version: "4.0.0"
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit, manual]

repos:
  # ---------------------------------------------------------------------------
  # General repository hygiene
  # ---------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        # LF everywhere (.gitattributes); PowerShell scripts are CRLF on purpose.
        args: [--fix=lf]
        exclude: \.ps1$
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-case-conflict
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: detect-private-key

  # ---------------------------------------------------------------------------
  # Secrets and sensitive files (commit). Gitleaks scans the staged changes
  # with the repository rules (.gitleaks.toml); CI scans every new commit.
  # ---------------------------------------------------------------------------
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: forbid-sensitive-files
        name: forbid state, plan, credential and kubeconfig files
        description: Refuses files that .gitignore excludes but `git add -f` could still stage.
        entry: >-
          Never commit Terraform state or plans, .env files, Terraform CLI
          credentials, kubeconfigs, private keys or secret tfvars (see
          .gitignore and docs/pre-commit.md). Unstage the file(s) listed below.
        language: fail
        files: |-
          (?x)(
            \.tfstate(\..+)?$ | \.terraform\.tfstate\.lock\.info$ |
            \.tfplan(\.json)?$ | (^|/)tfplan(\.json)?$ |
            (^|/)\.env(\.[^/]+)?$ | (^|/)\.envrc$ |
            (^|/)(\.terraformrc|terraform\.rc)$ |
            (^|/)kubeconfig$ | \.kubeconfig$ | (^|/)[^/]*kubeconfig[^/]*\.ya?ml$ | (^|/)microk8s[^/]*\.ya?ml$ |
            \.(pem|key|p12|pfx)$ | (^|/)id_(rsa|dsa|ecdsa|ed25519)$ |
            \.(secret|local)\.tfvars$ | \.local\.auto\.tfvars$ |
            (^|/)crash(\.[^/]+)?\.log$
          )

  # ---------------------------------------------------------------------------
  # Terraform: formatting and static checks (commit), init + validate and
  # TFLint (push), terraform test (manual). The push/manual hooks run the CI
  # scripts on the affected roots only (ci.py change detection); none needs
  # Azure credentials, a backend or a cluster.
  # ---------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: terraform-fmt
        name: terraform fmt (files are rewritten, re-stage them)
        entry: terraform fmt
        language: system
        files: \.(tf|tfvars|tftest\.hcl)$

      - id: azure-config
        name: Azure provider/backend static checks (ci.py azure-config)
        entry: python ci/scripts/ci.py azure-config az-infra-generic
        language: python
        files: ^(az-infra-generic/.*\.(tf|hcl)|ci/scripts/ci\.py|ci/projects/az-infra-generic\.json)$
        pass_filenames: false

      - id: terraform-validate
        name: terraform init + validate (affected roots)
        entry: ci/scripts/pre-commit-hook.sh validate
        language: script
        files: ^(az-infra-generic|tp-local|ci)/
        exclude: \.md$
        require_serial: true
        stages: [pre-push, manual]

      - id: tflint
        name: TFLint (affected projects)
        entry: ci/scripts/pre-commit-hook.sh tflint
        language: script
        files: ^(az-infra-generic|tp-local|ci)/
        exclude: \.md$
        require_serial: true
        verbose: true
        stages: [pre-push, manual]

      - id: terraform-test
        name: terraform test, mocked providers (affected roots)
        entry: ci/scripts/pre-commit-hook.sh test
        language: script
        files: ^(az-infra-generic|tp-local|ci)/
        exclude: \.md$
        require_serial: true
        stages: [manual]

  # ---------------------------------------------------------------------------
  # Misconfiguration scanners (manual; CI runs them on every change). Same
  # configuration as CI: <project>/.trivyignore.yaml, <project>/.checkov.yaml,
  # ci/policies/checkov, and /.checkov.yaml for the workflows.
  # ---------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: trivy
        name: Trivy HIGH/CRITICAL misconfigurations (affected projects)
        entry: ci/scripts/pre-commit-hook.sh trivy
        language: script
        files: ^(az-infra-generic|tp-local|ci)/
        exclude: \.md$
        require_serial: true
        verbose: true
        stages: [manual]

      - id: checkov
        name: Checkov policies (affected projects, workflows)
        entry: ci/scripts/pre-commit-hook.sh checkov
        language: script
        files: ^(az-infra-generic|tp-local|ci|\.github/workflows)/|^\.checkov\.yaml$
        exclude: \.md$
        require_serial: true
        verbose: true
        stages: [manual]

  # ---------------------------------------------------------------------------
  # Shell scripts (same options as ci/scripts/lint.sh: severity >= warning)
  # ---------------------------------------------------------------------------
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        args: [--severity=warning, --external-sources]
