# Gitleaks configuration (secret detection in Git history), used by
# ci/scripts/security-scan.sh. Any finding fails the pipeline.
title = "generic-infra gitleaks configuration"

[extend]
# Start from the full default rule set.
useDefault = true

[[allowlists]]
description = "Public checksums: provider lock files and pinned CI tool digests contain no secret"
paths = [
  '''(^|/)\.terraform\.lock\.hcl$''',
  '''^ci/tool-versions\.env$''',
]
